<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5F7F8">
  <meta name="description" content="刘智琦的个人介绍、教育背景与兴趣。">
  <title>刘智琦｜个人主页</title>
  <style>
    @font-face {
      font-family: 'Jackie Segoe Variable';
      src: local('Segoe UI Variable Display');
      font-style: normal;
      font-weight: 300 700;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      font-synthesis: none;
      --ground: #F5F7F8;
      --ink: #193746;
      --secondary: #426273;
      --education-ground: #94C3E8;
      --education-school: #193746;
      --education-detail: #29495F;
      --education-date: #193746;
      --education-focus: #193746;
      --interest-ground: #E0EEE8;
      --education-interest-mid: #BAD9E8;
      --interest-contact-mid: #EBF3F0;
      --interest-ink: #193746;
      --content-width: 1200px;
      --gutter: 64px;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--ground);
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--ground);
      font-family: "Noto Sans SC", sans-serif;
      font-size: 20px;
      font-weight: 400;
      line-height: 1.7;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a { color: inherit; }

    a:focus-visible {
      outline: 3px solid #1556A6;
      outline-offset: 5px;
      border-radius: 2px;
    }

    .education a:focus-visible {
      outline-color: var(--education-focus);
    }

    .skip-link {
      position: absolute;
      z-index: 20;
      top: 8px;
      left: 8px;
      padding: 8px 14px;
      transform: translateY(-160%);
      color: var(--ground);
      background: var(--ink);
      font-size: 16px;
      line-height: 1.4;
    }

    .skip-link:focus { transform: translateY(0); }

    .content-frame {
      width: min(var(--content-width), calc(100% - 2 * var(--gutter)));
      margin-inline: auto;
    }

    .site-header {
      position: relative;
      z-index: 2;
      height: 84px;
      background: var(--ground);
    }

    .header-inner {
      display: flex;
      height: 100%;
      align-items: center;
      justify-content: flex-start;
    }

    .brand,
    .main-nav a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      text-decoration: none;
      white-space: nowrap;
    }

    .brand {
      font-size: 16px;
      font-weight: 500;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 36px;
      font-size: 16px;
      font-weight: 500;
      line-height: 1.4;
    }

    /* Navigation is static; keyboard focus remains visible. */
    .main-nav a { position: relative; }
    .hero-identity { display: flex; align-items: center; gap: 24px; margin-bottom: 32px; }
    .hero-identity h1 { margin-bottom: 0; flex: 0 0 auto; }
    .hero-portrait { margin: 0; flex: 0 0 168px; width: 168px; height: 168px; padding: 5px; border: 1px solid #D8DBD6; border-radius: 23px; background: #F0EFE9; overflow: hidden; }
    .hero-portrait[hidden] { display: none; }
    .hero-portrait img { display: block; width: 156px; height: 156px; object-fit: cover; object-position: 50% 58%; border-radius: 17px; filter: saturate(.74) contrast(.86) brightness(.98) sepia(.22); }

    main { display: block; }

    .story-stage {
      position: relative;
      isolation: isolate;
    }

    .hero {
      position: relative;
      height: 680px;
      overflow: hidden;
      background: linear-gradient(180deg, var(--ground) 0%, var(--ground) calc(100% - 80px), #EAF0F3 100%);
    }

    .hero::after,
    .education::after {
      content: "";
      position: absolute;
      z-index: 0;
      top: 0;
      right: 0;
      width: min(66%, 880px);
      height: 100%;
      pointer-events: none;
      mask-image: linear-gradient(90deg, transparent 0%, #000 31%, #000 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 31%, #000 100%);
    }

    .hero::after {
      background: linear-gradient(102deg,
        rgba(255,255,255,0) 0%,
        rgba(214,239,244,.08) 42%,
        rgba(177,220,231,.14) 100%);
    }

    .education::after {
      background: linear-gradient(102deg,
        rgba(255,255,255,0) 0%,
        rgba(222,241,249,.11) 43%,
        rgba(52,126,180,.07) 100%);
      -webkit-mask-image:
        linear-gradient(90deg, transparent 0%, #000 31%, #000 100%),
        linear-gradient(180deg, transparent 0, #000 80px, #000 calc(100% - 80px), transparent 100%);
      -webkit-mask-composite: source-in;
      mask-image:
        linear-gradient(90deg, transparent 0%, #000 31%, #000 100%),
        linear-gradient(180deg, transparent 0, #000 80px, #000 calc(100% - 80px), transparent 100%);
      mask-composite: intersect;
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      height: 100%;
      padding-top: 110px;
    }

    .hero-copy {
      width: 44%;
      max-width: 490px;
    }

    h1, h2, h3, p { margin: 0; }

    .hero-copy h1 {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 28px;
      font-size: 32px;
      font-weight: 500;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .english-name {
      font-family: 'Jackie Segoe Variable', 'Segoe UI Variable', sans-serif;
      font-size: 28px;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: 0;
      font-optical-sizing: auto;
    }

    .chinese-name {
      font-family: "Noto Sans SC", sans-serif;
      font-size: 80px;
      font-weight: 550;
      line-height: 1.1;
      letter-spacing: -.025em;
    }

    .hero-copy p { max-width: 490px; }

    .text-link {
      display: inline-flex;
      align-items: center;
      margin-top: 28px;
      font-size: 20px;
      font-weight: 400;
      text-decoration-thickness: 1px;
      text-underline-offset: 6px;
    }

    .education {
      position: relative;
      height: 650px;
      overflow: hidden;
      color: var(--education-school);
      background: linear-gradient(180deg,
        #EAF0F3 0px,
        var(--education-ground) 80px,
        var(--education-ground) calc(100% - 80px),
        var(--education-interest-mid) 100%);
    }

    .education-inner {
      position: relative;
      z-index: 1;
      height: 100%;
      padding-top: 80px;
    }

    h2 {
      font-size: 40px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .education-copy {
      position: relative;
      z-index: 2;
      width: 48%;
      max-width: 684px;
    }

    .education h2 {
      margin-bottom: 54px;
      color: var(--education-school);
    }

    .education-record + .education-record { margin-top: 40px; }

    .education-date {
      margin-bottom: 7px;
      color: var(--education-date);
      font-size: 18px;
      font-weight: 550;
      line-height: 1.5;
    }

    .education-school {
      color: var(--education-school);
      font-size: 30px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0;
    }

    .education-detail {
      margin-top: 8px;
      color: var(--education-detail);
      font-size: 22px;
      font-weight: 450;
      line-height: 1.65;
    }

    .material-track {
      position: absolute;
      z-index: 0;
      inset: 0 max(calc((100vw - var(--content-width)) / 2), var(--gutter)) 0 auto;
      width: min(56%, 672px);
      pointer-events: none;
    }

    .material-sticky {
      position: sticky;
      top: 100px;
      display: grid;
      width: 100%;
      height: 620px;
      place-items: center;
    }

    .orange-sphere {
      position: absolute;
      z-index: 1;
      top: 55px;
      right: 0;
      width: 96px;
      height: 96px;
      pointer-events: none;
    }

    .orange-sphere img {
      display: block;
      width: 100%;
      height: 100%;
    }

    .studio-canvas {
      position: absolute;
      z-index: 3;
      top: -48px;
      right: 0;
      display: block;
      width: 100%;
      height: calc(100% + 96px);
      opacity: 0;
      pointer-events: none;
    }

    .studio-fallback {
      position: absolute;
      z-index: 2;
      top: -48px;
      right: 0;
      display: block;
      width: 100%;
      height: calc(100% + 96px);
      pointer-events: none;
    }

    .material-sticky .j-art,
    .material-sticky .orange-sphere { opacity: 0; }

    .material-sticky.webgl-ready .studio-fallback { opacity: 0; }
    .material-sticky.webgl-ready .studio-canvas { opacity: 1; }

    .j-art {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
      transform: translateX(0) rotate(-6deg) scale(.94);
      transform-origin: 50% 50%;
      will-change: transform;
    }

    .hero-overline { stroke-linecap: round; }

    .interests {
      position: relative;
      height: 420px;
      overflow: hidden;
      background: linear-gradient(180deg,
        var(--education-interest-mid) 0px,
        var(--interest-ground) 80px,
        var(--interest-ground) calc(100% - 80px),
        var(--interest-contact-mid) 100%);
    }

    .interests-inner {
      position: relative;
      height: 100%;
      padding-top: 80px;
    }

    .interests h2 {
      margin-bottom: 12px;
      font-family: "Noto Serif SC", serif;
      font-size: 48px;
      font-weight: 550;
      line-height: 1.25;
      letter-spacing: -.025em;
    }

    .interest-words {
      position: absolute;
      top: 202px;
      right: 0;
      left: 0;
      display: grid;
      height: 112px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: center;
      pointer-events: none;
    }

    .interest-group {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .piano-word-wrap {
      position: relative;
      display: inline-block;
      flex: 0 0 auto;
    }

    .piano-note {
      position: absolute;
      z-index: 1;
      width: 20px;
      height: 22px;
      overflow: visible;
      pointer-events: none;
    }

    .piano-note-blue { left: 12px; top: -20px; }
    .piano-note-orange { right: 4px; top: -24px; }

    .interest-word {
      display: inline-block;
      flex: 0 0 auto;
      font-family: "Noto Sans SC", sans-serif;
      font-size: 52px;
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: 0;
      white-space: nowrap;
      color: var(--interest-ink);
    }

    .interest-word.piano {
      font-family: "KaiTi", "楷体", serif;
      font-size: 52px;
      font-weight: 400;
      letter-spacing: .06em;
    }

    .interest-word.museum {
      font-family: "Noto Serif SC", serif;
      font-size: 52px;
      font-weight: 500;
      letter-spacing: .08em;
    }

    .interest-group.piano-group { justify-self: start; }
    .interest-group.museum-group { justify-self: center; }
    .interest-group.games-group { justify-self: end; }

    .interest-art {
      display: block;
      flex: 0 0 112px;
      width: 112px;
      height: 112px;
      overflow: visible;
    }

    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    .pixel-games {
      display: inline-flex;
      flex: 0 0 auto;
      height: 59.8px;
      align-items: center;
      gap: 4px;
    }

    .pixel-glyph {
      display: block;
      flex: 0 0 52px;
      width: 52px;
      height: 52px;
      overflow: visible;
      shape-rendering: crispEdges;
    }

    .site-footer {
      height: 244px;
      background: linear-gradient(180deg,
        var(--interest-contact-mid) 0px,
        var(--ground) 80px,
        var(--ground) 100%);
    }

    .footer-inner {
      display: flex;
      height: 100%;
      align-items: flex-end;
      justify-content: space-between;
      padding-bottom: 92px;
    }

    .footer-contact h2 { line-height: 1.25; }

    .footer-contact p {
      margin-top: 8px;
      color: var(--secondary);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.4;
    }

    .footer-name {
      font-size: 16px;
      font-weight: 500;
      line-height: 1.4;
    }

    /* Future notes area is reserved for later expansion and stays hidden. */
    #future-notes[hidden] { display: none; }

    @media (max-width: 1340px) {
      .chinese-name { font-size: 76px; }
      .interest-word { font-size: 48px; }
      .interest-word.piano,
      .interest-word.museum { font-size: 48px; }
      .pixel-games { height: 55.2px; }
      .pixel-glyph {
        flex-basis: 48px;
        width: 48px;
        height: 48px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .j-art { transform: translateX(0) rotate(-6deg) scale(.94) !important; }
      .orange-sphere { transform: none !important; }
    }


    /* Only the portrait scales; text remains at its native rendered size. */
    .hero-portrait { transition: transform 160ms cubic-bezier(.2,.7,.2,1); transform-origin: center; }
    .hero-portrait:hover { transform: scale(1.045); }
    .hero-portrait:active { transform: scale(1.06); }
    @media (prefers-reduced-motion: reduce) {
      .hero-portrait { transform: none !important; transition: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <header class="site-header" id="top">
    <div class="content-frame header-inner">
      <nav class="main-nav" aria-label="主导航">
        <a href="#education">教育背景</a>
        <a href="#interests">兴趣</a>
        <a href="#contact">联系方式</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <div class="story-stage">
      <section class="hero" aria-labelledby="hero-title">
        <div class="content-frame hero-inner">
          <div class="hero-copy">
            <div class="hero-identity">
            <h1 id="hero-title"><span class="chinese-name">刘智琦</span><span class="english-name">Jackie</span></h1>
            <figure class="hero-portrait" id="hero-portrait"><img src="assets/portrait.jpg" alt="刘智琦的个人照片" width="156" height="156"></figure>
            </div>
            <p>本科就读于中山大学中山医学院临床医学专业，2026 年起在北京大学第六医院学习精神病与精神卫生学。</p>
            <a class="text-link" href="#education">了解我的教育背景</a>
          </div>
        </div>
      </section>

      <section class="education" id="education" aria-labelledby="education-title">
        <div class="content-frame education-inner">
          <div class="education-copy">
            <h2 id="education-title">教育背景</h2>
            <article class="education-record">
              <p class="education-date">2021—2026</p>
              <h3 class="education-school">中山大学</h3>
              <p class="education-detail">中山医学院<br>临床医学 · 本科</p>
            </article>
            <article class="education-record">
              <p class="education-date">2026—</p>
              <h3 class="education-school">北京大学</h3>
              <p class="education-detail">第六医院（北京大学精神卫生研究所）<br>精神病与精神卫生学 · 硕士</p>
            </article>
          </div>
        </div>
      </section>

      <div class="material-track" aria-hidden="true">
        <div class="material-sticky">
          <img class="studio-fallback" src="three-initial-fallback.png" alt="">
          <canvas class="studio-canvas" id="studio-canvas" aria-hidden="true"></canvas>
          <svg class="j-art" id="j-art" viewBox="0 0 640 640" focusable="false" xmlns="http://www.w3.org/2000/svg">

            <path d="M381 211V371C381 471 339 516 273 516C222 516 189 484 178 437" fill="none" stroke="url(#inner-reflection)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" aria-hidden="true"/>

          <div class="orange-sphere" aria-hidden="true"><img src="sphere.svg" alt=""></div>
        </div>
      </div>
    </div>

    <section class="interests" id="interests" aria-labelledby="interests-title">
      <div class="content-frame interests-inner">
        <h2 id="interests-title">学习之余</h2>
        <div class="interest-words">
          <div class="interest-group piano-group">
            <span class="piano-word-wrap">
              <span class="interest-word piano">钢琴</span>
              <svg class="piano-note piano-note-blue" viewBox="0 0 20 22" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">

<script>
    (() => {
      const links = [...document.querySelectorAll('.main-nav a')];
      let pending = false;
      function update() {
        pending = false;
        let id = '';
        if (scrollY + innerHeight >= document.documentElement.scrollHeight - 3) id = 'contact';
        else for (const link of links) {
          const section = document.querySelector(link.hash);
          if (section.getBoundingClientRect().top <= innerHeight * .38) id = section.id;
        }
        for (const link of links) {
          if (link.hash === '#' + id) link.setAttribute('aria-current', 'location');
          else link.removeAttribute('aria-current');
        }
      }
      addEventListener('scroll', () => { if (!pending) { pending = true; requestAnimationFrame(update); } }, {passive:true});
      addEventListener('resize', update, {passive:true});
      update();
    })();
  </script>
